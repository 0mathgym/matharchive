<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Solution Hub - 고등학교 수학 아카이빙 & 손글씨 풀이 공유</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
        }
        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md flex items-center justify-center">
                        <i data-lucide="book-open-check" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight leading-none">Math Solution Hub</h1>
                        <p class="text-xs text-indigo-600 font-medium mt-0.5">수학 아카이빙 &amp; 손글씨 풀이의 집단지성</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2 sm:space-x-3">
                    <button onclick="fetchDataFromCloud(true)" title="최신 데이터 동기화" class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition flex items-center gap-1 text-xs font-semibold">
                        <i data-lucide="refresh-cw" id="sync-spinner" class="w-4 h-4"></i>
                        <span class="hidden lg:inline">동기화</span>
                    </button>

                    <div class="hidden md:flex items-center space-x-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                        <span class="text-xs font-semibold text-slate-500 px-2">시험 대비:</span>
                        <select id="header-category-select" onchange="selectCategory(this.value)" class="bg-white text-xs font-medium text-slate-700 py-1 px-2 rounded border border-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:hidden bg-slate-50 px-4 py-2 border-t border-slate-200 flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-600 flex items-center gap-1">
                <i data-lucide="folder" class="w-3.5 h-3.5 text-indigo-600"></i> 시험 대비:
            </span>
            <select id="mobile-category-select" onchange="selectCategory(this.value)" class="bg-white text-xs font-medium text-slate-700 py-1 px-2 rounded border border-slate-300 focus:outline-none max-w-[200px]">
            </select>
        </div>
    </header>

    <div id="cloud-sync-banner" class="bg-indigo-900 text-white text-xs py-1.5 px-4 shadow-inner">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span id="sync-status-icon" class="w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse"></span>
                <span id="sync-status-text" class="font-medium">서버 데이터 동기화 확인 중...</span>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <div class="flex items-center space-x-2 flex-wrap gap-y-1">
                    <span id="category-badge" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700 border border-indigo-200">
                        수학
                    </span>
                    <h2 id="category-title" class="text-xl font-bold text-slate-900">시험 대비 문항 목록</h2>
                </div>
                <p id="category-desc" class="text-xs text-slate-500 mt-1">고등학교 수학 기출 문항별 손글씨 풀이 공유 및 질의응답 공간입니다.</p>
            </div>
        </div>

        <!-- 문항 목록 뷰 -->
        <div id="view-question-list" class="space-y-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                <div class="relative flex-grow max-w-md">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="문항 번호 또는 개념 태그 검색 (예: 15번, #평균값정리)" class="w-full pl-9 pr-4 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <div class="flex items-center space-x-2">
                    <select id="tag-filter-select" onchange="filterByTag(this.value)" class="text-xs bg-slate-50 border border-slate-200 text-slate-700 py-2 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ALL">전체 단원/태그</option>
                    </select>

                    <select id="sort-select" onchange="changeSorting(this.value)" class="text-xs bg-slate-50 border border-slate-200 text-slate-700 py-2 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="default">기본순 (문항 순서)</option>
                        <option value="fewest">💡 풀이가 적은 문항 우선</option>
                        <option value="most_solutions">🔥 풀이가 많은 문항 순</option>
                    </select>
                </div>
            </div>

            <div id="questions-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>

            <div id="no-questions-msg" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 p-8">
                <i data-lucide="help-circle" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                <h3 class="text-base font-bold text-slate-700">등록된 수학 문항이 없습니다.</h3>
            </div>
        </div>

        <!-- 문항 상세 뷰 -->
        <div id="view-question-detail" class="hidden space-y-6">
            <div class="flex items-center justify-between">
                <button onclick="goHome()" class="inline-flex items-center space-x-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-2 rounded-xl transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>전체 문항 목록으로 돌아가기</span>
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-5 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3 bg-slate-50/50">
                    <div class="flex items-center space-x-3">
                        <span id="detail-q-num" class="bg-indigo-600 text-white font-bold text-sm px-3 py-1 rounded-lg shadow-sm">
                            1번
                        </span>
                        <div>
                            <h3 id="detail-q-title" class="font-bold text-slate-900 text-base">문항 상세</h3>
                            <div class="flex items-center space-x-2 mt-0.5">
                                <span id="detail-q-score" class="text-xs font-semibold text-slate-500">배점: -</span>
                                <span class="text-slate-300">•</span>
                                <div id="detail-q-tags" class="flex flex-wrap gap-1"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="p-4 sm:p-6 bg-slate-900/5 flex justify-center items-center">
                    <div class="relative max-w-3xl w-full bg-white rounded-xl shadow-md overflow-hidden border border-slate-200 group cursor-zoom-in" onclick="openLightbox(state.currentQuestion ? state.currentQuestion.imageUrl : '')">
                        <img id="detail-q-image" src="" alt="수학 문제 이미지" class="w-full h-auto object-contain max-h-[500px]">
                    </div>
                </div>
            </div>

            <div class="bg-indigo-900 text-white p-6 rounded-2xl shadow-md flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="space-y-1 text-center sm:text-left">
                    <h3 class="text-lg font-bold flex items-center justify-center sm:justify-start gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-amber-300"></i> 손글씨 풀이 갤러리
                    </h3>
                    <p class="text-xs text-indigo-200">다양한 접근법을 비교해보세요!</p>
                </div>
                <button onclick="openAddSolutionModal()" class="w-full sm:w-auto px-5 py-3 bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold text-xs rounded-xl shadow-lg transition flex items-center justify-center gap-2 transform active:scale-95">
                    <i data-lucide="camera" class="w-4 h-4"></i> + 내 손글씨 풀이 공유하기
                </button>
            </div>

            <div id="solutions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

            <div id="no-solutions-msg" class="hidden text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 p-8">
                <i data-lucide="pen-tool" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                <h4 class="text-base font-bold text-slate-700">아직 등록된 손글씨 풀이가 없습니다.</h4>
                <button onclick="openAddSolutionModal()" class="mt-4 px-4 py-2 text-xs font-bold bg-indigo-600 text-white rounded-xl shadow hover:bg-indigo-700 transition">
                    첫 번째 풀이 작성하기
                </button>
            </div>
        </div>

    </main>

    <!-- MODAL: 손글씨 풀이 등록 -->
    <div id="modal-add-solution" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200">
            <div class="px-6 py-4 bg-indigo-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-sm flex items-center gap-2">
                    <i data-lucide="camera" class="w-4 h-4 text-amber-300"></i> 내 손글씨 풀이 등록
                </h3>
                <button onclick="closeAddSolutionModal()" class="text-slate-300 hover:text-white transition p-1 rounded-lg" title="닫기">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form onsubmit="handleSaveSolution(event)" class="p-6 space-y-4">
                <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-800 flex items-start gap-2">
                    <i data-lucide="shield" class="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5"></i>
                    <div>
                        <strong>익명 보장:</strong> 게시판에는 <b>'익명 학생'</b>으로 게시됩니다.
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">실명 (선생님 확인용) *</label>
                        <input type="text" id="input-sol-name" required placeholder="예: 홍길동" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">학번 *</label>
                        <input type="text" id="input-sol-stuid" required placeholder="예: 20315" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">풀이 핵심 요약 및 코멘트 *</label>
                    <input type="text" id="input-sol-desc" required placeholder="예: 사잇값 정리 조건 활용" class="w-full text-xs p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">손글씨 노트 촬영 사진 *</label>
                    <input type="file" id="input-sol-file" accept="image/*" required onchange="previewSolutionImage(this)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    <div id="sol-img-preview-container" class="mt-2 hidden border border-slate-200 rounded-lg p-2 bg-slate-50 text-center">
                        <img id="sol-img-preview" src="" alt="미리보기" class="max-h-40 mx-auto object-contain rounded">
                    </div>
                </div>

                <div class="pt-3 flex items-center justify-end space-x-2 border-t border-slate-100">
                    <button type="button" onclick="closeAddSolutionModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                        취소
                    </button>
                    <button type="submit" class="px-4 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow transition">
                        풀이 게시하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Lightbox -->
    <div id="modal-lightbox" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 hidden" onclick="closeLightbox()">
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white hover:text-slate-300 p-2 rounded-full bg-slate-800/80 transition">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
        <img id="lightbox-image" src="" alt="확대 이미지" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation()">
    </div>

    <!-- MODAL: Custom Dialog -->
    <div id="modal-custom-dialog" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 text-center space-y-4 border border-slate-200">
            <h3 id="dialog-title" class="font-bold text-base text-slate-900">알림</h3>
            <p id="dialog-message" class="text-xs text-slate-600 leading-relaxed"></p>
            <div id="dialog-buttons" class="flex justify-center space-x-2 pt-2"></div>
        </div>
    </div>

    <script>
        // ====== [중요] 구글 앱스클립트 배포 URL을 아래 큰따옴표 안에 넣어주세요 ======
        const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbywlFkOFedpwlKfXb4QgCMwUFVJbUrxq88OoBJ_3ZFVhhtni0tIszvyYvCICYTGot8Paw/exec";

        const state = {
            gasScriptUrl: '',
            currentCategoryId: '',
            currentQuestionId: null,
            currentQuestion: null,
            searchQuery: '',
            selectedTag: 'ALL',
            sortBy: 'default',
            categories: [],
            questions: [],
            solutions: []
        };

        function updateSyncBanner(status, text) {
            const statusText = document.getElementById('sync-status-text');
            const statusIcon = document.getElementById('sync-status-icon');
            if (statusText) statusText.innerText = text;
            if (statusIcon) {
                statusIcon.className = "w-2 h-2 rounded-full inline-block ";
                if (status === true) statusIcon.className += "bg-emerald-400";
                else if (status === 'loading') statusIcon.className += "bg-amber-400 animate-pulse";
                else statusIcon.className += "bg-rose-400";
            }
        }

        async function fetchDataFromCloud(showToast = false) {
            state.gasScriptUrl = DEFAULT_GAS_URL || localStorage.getItem('msh_gas_url') || "";
            if (!state.gasScriptUrl) {
                updateSyncBanner(false, '서버 URL이 설정되지 않았습니다.');
                return;
            }

            const spinner = document.getElementById('sync-spinner');
            if (spinner) spinner.classList.add('animate-spin');
            updateSyncBanner('loading', '최신 데이터 동기화 중...');

            try {
                const res = await fetch(state.gasScriptUrl);
                const json = await res.json();

                if (json.result === 'success' && json.data) {
                    state.categories = json.data.categories || [];
                    state.questions = json.data.questions || [];
                    state.solutions = json.data.solutions || [];

                    if (!state.currentCategoryId && state.categories.length > 0) {
                        state.currentCategoryId = state.categories[0].id;
                    }

                    renderCategories();
                    if (state.currentQuestionId) renderSolutions(state.currentQuestionId);
                    else renderQuestionList();

                    updateSyncBanner(true, '실시간 연결됨');
                    if (showToast) showAlert('동기화 완료', '최신 데이터를 불러왔습니다.');
                }
            } catch (err) {
                updateSyncBanner(false, '서버 연결 실패');
            } finally {
                if (spinner) spinner.classList.remove('animate-spin');
            }
        }

        function renderCategories() {
            const headerSelect = document.getElementById('header-category-select');
            const mobileSelect = document.getElementById('mobile-category-select');

            let optionsHtml = '';
            state.categories.forEach(cat => {
                optionsHtml += `<option value="${cat.id}" ${cat.id === state.currentCategoryId ? 'selected' : ''}>[${cat.subject}] ${cat.title}</option>`;
            });

            headerSelect.innerHTML = optionsHtml;
            mobileSelect.innerHTML = optionsHtml;

            const currCat = state.categories.find(c => c.id === state.currentCategoryId);
            if (currCat) {
                document.getElementById('category-badge').innerText = currCat.subject;
                document.getElementById('category-title').innerText = currCat.title;
                document.getElementById('category-desc').innerText = currCat.desc || '';
            }
            lucide.createIcons();
        }

        function selectCategory(catId) {
            state.currentCategoryId = catId;
            state.currentQuestionId = null;
            renderCategories();
            goHome();
        }

        function renderQuestionList() {
            const grid = document.getElementById('questions-grid');
            const emptyMsg = document.getElementById('no-questions-msg');
            const tagSelect = document.getElementById('tag-filter-select');

            let list = state.questions.filter(q => q.categoryId === state.currentCategoryId);

            const tagsSet = new Set();
            list.forEach(q => q.tags.forEach(t => tagsSet.add(t)));
            let tagOptions = '<option value="ALL">전체 단원/태그</option>';
            tagsSet.forEach(t => {
                tagOptions += `<option value="${t}" ${state.selectedTag === t ? 'selected' : ''}>#${t}</option>`;
            });
            tagSelect.innerHTML = tagOptions;

            if (state.searchQuery) {
                const qTerm = state.searchQuery.toLowerCase();
                list = list.filter(q => q.questionNumber.toLowerCase().includes(qTerm) || q.title.toLowerCase().includes(qTerm));
            }

            if (list.length === 0) {
                grid.innerHTML = '';
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            grid.innerHTML = list.map(q => {
                const solCount = state.solutions.filter(s => s.questionId === q.id).length;
                return `
                    <div onclick="openQuestionDetail('${q.id}')" class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-slate-200 overflow-hidden cursor-pointer transition transform hover:-translate-y-1 flex flex-col justify-between group">
                        <div>
                            <div class="relative bg-slate-100 h-40 overflow-hidden border-b border-slate-100">
                                <img src="${q.imageUrl}" alt="${q.questionNumber}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <div class="absolute top-3 left-3 bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-lg">
                                    ${q.questionNumber}
                                </div>
                            </div>
                            <div class="p-4 space-y-2">
                                <h4 class="font-bold text-slate-900 text-sm line-clamp-2">${q.title}</h4>
                            </div>
                        </div>
                        <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-xs">
                            <span class="font-semibold text-slate-600">풀이 ${solCount}개</span>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function openQuestionDetail(qId) {
            state.currentQuestionId = qId;
            const q = state.questions.find(item => item.id === qId);
            if (!q) return;

            state.currentQuestion = q;
            document.getElementById('detail-q-num').innerText = q.questionNumber;
            document.getElementById('detail-q-title').innerText = q.title;
            document.getElementById('detail-q-image').src = q.imageUrl;

            document.getElementById('view-question-list').classList.add('hidden');
            document.getElementById('view-question-detail').classList.remove('hidden');

            renderSolutions(q.id);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderSolutions(qId) {
            const grid = document.getElementById('solutions-grid');
            const emptyMsg = document.getElementById('no-solutions-msg');

            const list = state.solutions.filter(s => s.questionId === qId);

            if (list.length === 0) {
                grid.innerHTML = '';
                emptyMsg.classList.remove('hidden');
                return;
            } else {
                emptyMsg.classList.add('hidden');
            }

            grid.innerHTML = list.map(sol => `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between">
                    <div class="relative bg-amber-50/50 h-64 overflow-hidden cursor-zoom-in" onclick="openLightbox('${sol.imageUrl}')">
                        <img src="${sol.imageUrl}" alt="손글씨 풀이" class="w-full h-full object-contain p-2">
                    </div>
                    <div class="p-4 space-y-2">
                        <div class="flex items-center justify-between text-xs font-bold text-slate-700">
                            <span>익명 학생</span>
                            <span class="text-slate-400 text-[11px]">${sol.createdAt}</span>
                        </div>
                        <p class="text-xs text-slate-700 bg-slate-50 p-2.5 rounded-xl border border-slate-100 font-medium">
                            "${sol.description}"
                        </p>
                        ${sol.teacherComment ? `
                            <div class="bg-indigo-50 border border-indigo-200 p-2.5 rounded-xl text-xs text-indigo-900">
                                <strong>선생님 피드백:</strong> ${sol.teacherComment}
                            </div>
                        ` : ''}
                        <button onclick="likeSolution('${sol.id}')" class="flex items-center space-x-1 text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100">
                            <i data-lucide="heart" class="w-3.5 h-3.5 fill-rose-500"></i>
                            <span>도움돼요 ${sol.likes}</span>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        async function likeSolution(solId) {
            const sol = state.solutions.find(s => s.id === solId);
            if (sol) {
                sol.likes += 1;
                renderSolutions(state.currentQuestionId);
                fetch(state.gasScriptUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'LIKE_SOLUTION', solutionId: solId })
                });
            }
        }

        function handleSearch(val) { state.searchQuery = val.trim(); renderQuestionList(); }
        function filterByTag(tag) { state.selectedTag = tag; renderQuestionList(); }
        function changeSorting(sortVal) { state.sortBy = sortVal; renderQuestionList(); }
        function goHome() {
            state.currentQuestionId = null;
            document.getElementById('view-question-list').classList.remove('hidden');
            document.getElementById('view-question-detail').classList.add('hidden');
            renderQuestionList();
        }

        function openAddSolutionModal() { document.getElementById('modal-add-solution').classList.remove('hidden'); }
        function closeAddSolutionModal() { document.getElementById('modal-add-solution').classList.add('hidden'); }
        function openLightbox(src) { document.getElementById('lightbox-image').src = src; document.getElementById('modal-lightbox').classList.remove('hidden'); }
        function closeLightbox() { document.getElementById('modal-lightbox').classList.add('hidden'); }

        let newSolutionCompressedImg = null;
        function previewSolutionImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    newSolutionCompressedImg = e.target.result;
                    document.getElementById('sol-img-preview').src = newSolutionCompressedImg;
                    document.getElementById('sol-img-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function handleSaveSolution(e) {
            e.preventDefault();
            const sName = document.getElementById('input-sol-name').value.trim();
            const sId = document.getElementById('input-sol-stuid').value.trim();
            const sDesc = document.getElementById('input-sol-desc').value.trim();

            if (!newSolutionCompressedImg) return;

            const newSol = {
                id: 'sol-' + Date.now(),
                questionId: state.currentQuestionId,
                studentName: sName,
                studentId: sId,
                imageUrl: newSolutionCompressedImg,
                description: sDesc,
                createdAt: new Date().toISOString().split('T')[0]
            };

            closeAddSolutionModal();
            showAlert('제출 완료', '손글씨 풀이가 익명으로 안전하게 제출되었습니다!');

            await fetch(state.gasScriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: 'ADD_SOLUTION', solution: newSol })
            });

            fetchDataFromCloud();
        }

        function showAlert(title, message) {
            document.getElementById('dialog-title').innerText = title;
            document.getElementById('dialog-message').innerText = message;
            document.getElementById('dialog-buttons').innerHTML = `<button onclick="closeCustomDialog()" class="px-5 py-2 text-xs font-bold bg-indigo-600 text-white rounded-xl">확인</button>`;
            document.getElementById('modal-custom-dialog').classList.remove('hidden');
        }
        function closeCustomDialog() { document.getElementById('modal-custom-dialog').classList.add('hidden'); }

        window.onload = function() { fetchDataFromCloud(); };
    </script>
</body>
</html>
